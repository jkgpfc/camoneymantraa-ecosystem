<!DOCTYPE html>
<!-- © CA Money Mantra. All rights reserved. Proprietary software: copying, redistribution or reuse of this code, in whole or in part, is not permitted. -->

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TapeBot">
<meta name="theme-color" content="#0f2a44">
<title>Tape Reader Bot — All NSE (iPhone)</title>
<style>
:root{--ink:#14202e;--mut:#5b6b7c;--line:#dfe5ec;--bg:#f4f6f9;--card:#fff;--navy:#0f2a44;--acc:#1c6fd1;--up:#0f8a4b;--dn:#c0392b;--warn:#b7791f;--chip:#eef3f9}
*{box-sizing:border-box}body{margin:0;font:13px/1.45 "Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.2px}header .sub{opacity:.75;font-size:12px}
.badge{padding:3px 9px;border-radius:12px;font-size:12px;font-weight:600;background:#2b4a6a}
.b-up{background:#15794a}.b-dn{background:#a93226}.b-mid{background:#9a6a12}
.sp{flex:1}button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.pri:disabled{opacity:.5;cursor:default}
button.sm{padding:2px 8px;font-size:12px}
nav{display:flex;gap:2px;padding:0 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:48px;z-index:4}
nav a{padding:10px 12px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
nav a.on{color:var(--acc);border-color:var(--acc);font-weight:600}nav a .n{background:var(--chip);border-radius:9px;padding:0 6px;margin-left:4px;font-size:11px;color:var(--ink)}
main{padding:14px 16px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.mut{color:var(--mut)}.small{font-size:12px}.up{color:var(--up)}.dn{color:var(--dn)}.wr{color:var(--warn)}
table{border-collapse:collapse;width:100%;background:#fff}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f7f9fb;font-weight:600;position:sticky;top:0;cursor:pointer;font-size:12px}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click:hover{background:#f2f7ff;cursor:pointer}.tw{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:8px}
.chip{display:inline-block;background:var(--chip);border-radius:10px;padding:1px 7px;margin:1px 2px;font-size:11px;color:#2b3e52}
.note{background:#fff8e6;border:1px solid #f1dfae;border-radius:6px;padding:8px 10px;margin-bottom:10px;font-size:12px}
.note.red{background:#fdecea;border-color:#f5c6c0}
.log{font:12px/1.4 Consolas,monospace;background:#0f1720;color:#cfe3f7;border-radius:6px;padding:8px;max-height:180px;overflow:auto;white-space:pre-wrap}
label{display:block;font-size:12px;color:var(--mut);margin:6px 0 2px}input[type=number],input[type=text],select,textarea{font:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:140px}
.kpi{display:flex;gap:10px;flex-wrap:wrap}.kpi div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:150px}
.kpi b{display:block;font-size:18px}.kpi span{font-size:12px;color:var(--mut)}
#modal{position:fixed;inset:0;background:rgba(10,20,30,.55);display:none;z-index:20;overflow:auto}
#modal .box{background:#fff;max-width:1100px;margin:30px auto;border-radius:10px;padding:16px}
.ck{display:flex;gap:6px;align-items:flex-start;margin:3px 0}.ck input{margin-top:3px}
.pass{color:var(--up);font-weight:700}.fail{color:var(--dn);font-weight:700}
canvas{width:100%;display:block;border:1px solid var(--line);border-radius:6px}
.hide{display:none}
.b-sync{background:#1c6fd1}.b-off{background:#5b6b7c}
.pbar{height:8px;background:#e4eaf1;border-radius:4px;overflow:hidden;margin:8px 0}
.pbar>i{display:block;height:100%;background:var(--acc);transition:width .25s ease}
.pill{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600}
.pill-up{background:#e6f6ee;color:#0f8a4b}.pill-dn{background:#fdecea;color:#c0392b}
.pill-wr{background:#fff4db;color:#9a6a12}.pill-nt{background:#eef3f9;color:#4a5c70}
details.card summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--mut);outline:none;padding:4px 0}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f2a44;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:50;max-width:92vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s ease}
#toast.show{opacity:1}
#toast.err{background:#a93226}
#toast.ok{background:#15794a}
header{padding-top:calc(10px + env(safe-area-inset-top));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
nav{-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tw{-webkit-overflow-scrolling:touch}
main{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
button,select,input,textarea{-webkit-tap-highlight-color:transparent}
@media(max-width:680px){
  body{font-size:14px}
  header{gap:8px;padding-bottom:8px}
  header h1{font-size:15px}
  header .sub{display:none}
  .badge{font-size:11px;padding:3px 7px}
  nav{top:0;position:sticky;padding:0 6px}
  nav a{padding:11px 10px;font-size:13px}
  main{padding:10px}
  .grid{grid-template-columns:1fr;gap:10px}
  .card{padding:12px}
  .kpi div{min-width:calc(50% - 6px);flex:1;padding:8px 10px}
  .kpi b{font-size:16px}
  button{min-height:40px;padding:8px 12px;font-size:14px}
  button.sm{min-height:34px;padding:5px 10px;font-size:12px}
  input[type=number],input[type=text],select,textarea{font-size:16px;min-height:40px;padding:8px 10px}
  .tw{max-height:62vh}
  th,td{padding:8px 7px;font-size:13px}
  td:nth-child(2),th:nth-child(2){position:sticky;left:0;background:#fff;z-index:2;box-shadow:1px 0 0 var(--line)}
  th:nth-child(2){background:#f7f9fb;z-index:3}
  #modal .box{margin:0;border-radius:0;min-height:100vh;padding:12px;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
}
@media print{header,nav,button{display:none}}
#gate{position:fixed;inset:0;z-index:50;background:rgba(10,20,30,.92);overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px}
#gate .gbox{background:#fff;color:var(--ink);max-width:560px;width:100%;border-radius:12px;padding:18px}
#gate h2{margin:0;font-size:20px}#gate .gdisc{font-size:12.5px;line-height:1.5;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fafbfc}
#gate .gdisc p{margin:0 0 8px}
.kc{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;background:#fbfcfe}
.kc-h{font-weight:700;font-size:13px;margin-bottom:4px}.kc-r{display:flex;gap:8px;font-size:12.5px;line-height:1.4;padding:3px 0;border-top:1px dashed #edf0f4}
.kc-r:first-of-type{border-top:0}.kc-t{flex:0 0 58px;color:var(--mut);font-weight:600}.kc-r a{color:var(--ink);text-decoration:none}.kc-r a:hover{text-decoration:underline}
.kc-x{white-space:nowrap;font-weight:700;margin-left:2px}
th{cursor:pointer;user-select:none;-webkit-user-select:none}th:hover{color:var(--acc)}th[data-sort]{color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>Tape Reader Bot</h1><span class="sub">All NSE Listed · Wyckoff + legends · iPhone</span>
  <span class="sp"></span>
  <span id="hdrAuto" class="badge b-up">Ready</span>
  <span id="hdrData" class="badge">No data</span>
  <span id="hdrTone" class="badge">Tone: –</span>
  <button id="btnSync">Sync</button>
  <button class="pri" id="btnRun" disabled>Scan</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
